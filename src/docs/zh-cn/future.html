<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于未来更新 · PyAI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Microsoft YaHei","Segoe UI",sans-serif;transition:background-color .3s,color .3s,border-color .3s,box-shadow .3s}
        :root{--bg-page:#f7f8fa;--bg-card:#ffffff;--text-title:#202938;--text-desc:#6b7280;--text-normal:#333;--border:#e5e7eb;--link:#3b7ddd;--hover:#f0f6ff;--code:#f4f5f7;--thead:#f0f6ff;--shadow:0 2px 12px rgba(0,0,0,.06);--tip:#fff7ed;--tip-border:#fdba74}
        .dark{--bg-page:#17181c;--bg-card:#222429;--text-title:#f1f3f7;--text-desc:#a1a5ad;--text-normal:#e5e7eb;--border:#383a42;--link:#79b8ff;--hover:#2b3444;--code:#2b2f36;--thead:#2b3444;--shadow:0 2px 12px rgba(0,0,0,.3);--tip:#2b2418;--tip-border:#8a5a2b}
        body{background:var(--bg-page);color:var(--text-normal);min-height:100vh;padding:20px 16px 60px}
        .topbar{max-width:860px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between}
        .back{color:var(--link);text-decoration:none;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);box-shadow:var(--shadow)}
        .back:hover{background:var(--hover)}
        .theme-toggle{border:1px solid var(--border);background:var(--bg-card);color:var(--text-normal);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;box-shadow:var(--shadow)}
        .container{max-width:860px;margin:0 auto;background:var(--bg-card);padding:40px 48px;border-radius:14px;box-shadow:var(--shadow)}
        h1{font-size:28px;color:var(--text-title);margin-bottom:8px;font-weight:700}
        .lead{color:var(--text-desc);font-size:15px;margin-bottom:24px;line-height:1.7}
        h2{font-size:21px;color:var(--text-title);margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
        p{line-height:1.8;margin:8px 0}
        ul,ol{line-height:1.8;margin:8px 0 8px 22px}
        li{margin:5px 0}
        code{background:var(--code);padding:2px 6px;border-radius:5px;font-family:Consolas,Monaco,"Courier New",monospace;font-size:13px}
        table{width:100%;border-collapse:collapse;margin:12px 0}
        th,td{border:1px solid var(--border);padding:8px 12px;text-align:left;font-size:14px}
        th{background:var(--thead);color:var(--text-title);font-weight:600}
        .tag{display:inline-block;background:var(--hover);color:var(--link);font-size:12px;padding:2px 10px;border-radius:12px;margin-right:6px;border:1px solid var(--border)}
    </style>
</head>
<body>
    <div class="topbar">
        <a class="back" href="index.html">← 返回</a>
        <button class="theme-toggle" id="toggleBtn">🌙</button>
    </div>
    <div class="container">
        <h1>关于未来更新</h1>
        <p class="lead">以下为 PyAI 正在规划或开发中的功能。</p>

        <h2>昼夜模式 <span class="tag">暂定</span></h2>
        <p>「设置」中已预留「昼夜模式」切换（白昼 / 黑夜），目前尚未实现深色界面配色，将在后续版本中完善。</p>

        <h2>语音朗读 <span class="tag">开发中</span></h2>
        <p>程序已内置 EdgeTTS 语音合成能力（<code>voice.py</code>），可下载并缓存 AI 的回复音频。当前界面尚未开放朗读开关，后续将支持让 AI「开口说话」。</p>

        <h2>更多计划</h2>
        <ul>
            <li>增加更多声音模型与更多语言支持；</li>
            <li>完善历史对话的搜索与管理；</li>
            <li>进一步优化记忆分析与人物画像的准确度。</li>
        </ul>

        <p>以上功能的具体上线时间以项目仓库为准，敬请期待。</p>
    </div>

    <script>
        const body = document.body;
        const toggleBtn = document.getElementById('toggleBtn');
        let isDark = localStorage.getItem('theme') === 'dark';
        function setTheme(){
            if(isDark){ body.classList.add('dark'); toggleBtn.textContent = '☀️'; }
            else { body.classList.remove('dark'); toggleBtn.textContent = '🌙'; }
        }
        setTheme();
        toggleBtn.addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            setTheme();
        });
    </script>
</body>
</html>
