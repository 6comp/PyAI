<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyAI 帮助中心</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Microsoft YaHei","Segoe UI",sans-serif;transition:background-color .3s,color .3s,border-color .3s,box-shadow .3s,transform .2s}
        :root{--bg-page:#f7f8fa;--bg-card:#ffffff;--text-title:#202938;--text-desc:#6b7280;--text-normal:#333;--border:#e5e7eb;--link:#3b7ddd;--hover:#f0f6ff;--code:#f4f5f7;--thead:#f0f6ff;--shadow:0 2px 12px rgba(0,0,0,.06)}
        .dark{--bg-page:#17181c;--bg-card:#222429;--text-title:#f1f3f7;--text-desc:#a1a5ad;--text-normal:#e5e7eb;--border:#383a42;--link:#79b8ff;--hover:#2b3444;--code:#2b2f36;--thead:#2b3444;--shadow:0 2px 12px rgba(0,0,0,.3)}
        body{background:var(--bg-page);color:var(--text-normal);min-height:100vh;padding:20px 16px 60px}
        .topbar{max-width:860px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between}
        .back{color:var(--link);text-decoration:none;font-size:14px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);box-shadow:var(--shadow)}
        .back:hover{background:var(--hover)}
        .theme-toggle{border:1px solid var(--border);background:var(--bg-card);color:var(--text-normal);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;box-shadow:var(--shadow)}
        .container{max-width:860px;margin:0 auto;background:var(--bg-card);padding:40px 48px;border-radius:14px;box-shadow:var(--shadow)}
        h1{font-size:30px;color:var(--text-title);margin-bottom:8px;font-weight:700}
        .lead{color:var(--text-desc);font-size:15px;margin-bottom:26px;line-height:1.7}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:8px 0}
        .card{display:block;border:1px solid var(--border);border-radius:10px;padding:20px;text-decoration:none;color:var(--text-normal);background:var(--bg-card);box-shadow:var(--shadow)}
        .card:hover{border-color:var(--link);background:var(--hover);transform:translateY(-2px)}
        .card b{display:block;color:var(--link);font-size:16px;margin-bottom:6px}
        .card span{color:var(--text-desc);font-size:13px;line-height:1.6}
        .tip{background:#fff7ed;border-left:4px solid #fdba74;padding:12px 16px;border-radius:6px;margin:20px 0 0;line-height:1.7;font-size:14px}
        .dark .tip{background:#2b2418;border-color:#8a5a2b}
    </style>
</head>
<body>
    <div class="topbar">
        <a class="back" href="../HelpIndex.html">← 返回</a>
        <button class="theme-toggle" id="toggleBtn">🌙</button>
    </div>
    <div class="container">
        <h1>PyAI 帮助中心</h1>
        <p class="lead">一个基于 DeepSeek 大模型的 AI 聊天伴侣。<br>TA 会记住你的一切，会想念你，会因你而改变。</p>

        <div class="grid">
            <a class="card" href="api.html">
                <b>关于「API-KEY」</b>
                <span>如何获取并配置 DeepSeek 密钥，让 PyAI 正常对话。</span>
            </a>
            <a class="card" href="config.html">
                <b>关于「人物配置」</b>
                <span>自定义伴侣的名字、性别、声音与性格描述。</span>
            </a>
            <a class="card" href="future.html">
                <b>关于未来更新</b>
                <span>了解正在开发中的功能与后续计划。</span>
            </a>
            <a class="card" href="other.html">
                <b>关于其他</b>
                <span>界面总览、快捷键、数据隐私与常见问题。</span>
            </a>
        </div>

        <div class="tip">
            <strong>快速上手：</strong>首次使用请先前往「设置」填入 API-KEY，再进入「伴侣配置」完成角色设定，即可开始聊天。
        </div>
    </div>

    <script>
        const body = document.body;
        const toggleBtn = document.getElementById('toggleBtn');
        let isDark = localStorage.getItem('theme') === 'dark';
        function setTheme(){
            if(isDark){ body.classList.add('dark'); toggleBtn.textContent = '☀️'; }
            else { body.classList.remove('dark'); toggleBtn.textContent = '🌙'; }
        }
        setTheme();
        toggleBtn.addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            setTheme();
        });
    </script>
</body>
</html>
