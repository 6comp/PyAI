<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpIndex 帮助索引</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, Microsoft YaHei, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 浅色模式 默认 */
        :root {
            --bg-page: #f7f8fa;
            --bg-card: #ffffff;
            --text-title: #202938;
            --text-desc: #666;
            --text-normal: #333;
            --border-color: #e5e7eb;
            --link-color: #3b7ddd;
            --hover-bg: #f0f6ff;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        /* 深色模式 */
        .dark {
            --bg-page: #17181c;
            --bg-card: #222429;
            --text-title: #f1f3f7;
            --text-desc: #a1a5ad;
            --text-normal: #e5e7eb;
            --border-color: #383a42;
            --link-color: #79b8ff;
            --hover-bg: #2b3444;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-normal);
        }

        .container {
            background: var(--bg-card);
            padding: 48px 60px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
            position: relative;
        }

        /* 昼夜切换按钮 */
        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-normal);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover {
            background-color: var(--hover-bg);
        }

        h1 {
            font-size: 28px;
            color: var(--text-title);
            text-align: center;
            margin-bottom: 32px;
            font-weight: 600;
        }

        .title-desc {
            font-size: 16px;
            color: var(--text-desc);
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
        }

        li {
            margin: 12px 0;
        }

        a {
            display: block;
            padding: 14px 18px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--link-color);
            font-size: 16px;
            transition: all 0.2s ease;
        }

        a:hover {
            background-color: var(--hover-bg);
            border-color: var(--link-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 切换按钮 -->
        <button class="theme-toggle" id="toggleBtn">🌙</button>

        <h1>HelpIndex 帮助索引</h1>
        <div class="title-desc">language · 选择语言以进入对应帮助文档</div>
        <ul>
            <li><a href="zh-cn/index.html">中文 - 简体</a></li>
            <li><a href="en/index.html">English</a></li>
        </ul>
    </div>

    <p>| src\docs 目录下的所有文档均由 CodeBuddy-DeepSeek-V4-Pro 完成 |</p>

    <script>
        const body = document.body;
        const toggleBtn = document.getElementById('toggleBtn');

        // 读取本地存储主题偏好，刷新页面不重置
        let isDark = localStorage.getItem('theme') === 'dark';

        function setTheme() {
            if (isDark) {
                body.classList.add('dark');
                toggleBtn.textContent = '☀️';
            } else {
                body.classList.remove('dark');
                toggleBtn.textContent = '🌙';
            }
        }

        // 初始化主题
        setTheme();

        // 点击切换
        toggleBtn.addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            setTheme();
        });
    </script>
</body>
</html>
